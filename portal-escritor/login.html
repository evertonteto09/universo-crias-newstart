<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Escritor | Histórias dos Crias</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <main class="auth-page fade-in">
        <section class="auth-card">
            <span class="eyebrow">ÁREA PRIVADA</span>
            <h1>Portal do Escritor</h1>
            <p>Entre para criar, editar, salvar rascunhos e publicar suas histórias.</p>

            <form id="login-form" class="stack-form">
                <label>
                    E-mail
                    <input id="email" type="email" autocomplete="email" required>
                </label>

                <label>
                    Senha
                    <input id="password" type="password" autocomplete="current-password" required>
                </label>

                <button class="primary-button" type="submit">Entrar com e-mail e senha</button>
                <p class="muted">Se o Discord já estiver vinculado à sua conta de escritor, você também pode entrar por ele.</p>
                <button id="discord-login-button" class="secondary-button" type="button">🎮 Entrar com Discord</button>
                <p id="login-message" class="form-message" role="alert" aria-live="polite"></p>
            </form>

            <a class="text-link" href="../conta.html">Minha conta (leitor)</a>
            <br><br>
            <a class="text-link" href="../index.html">← Voltar</a>
        </section>
    </main>

    <script type="module" src="../assets/js/pages/writer-login.js"></script>
</body>
</html>
